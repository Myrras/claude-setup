name: Version check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check plugin version bump
        env:
          BASE: ${{ github.base_ref }}
        run: |
          other=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^(README\.md|LICENSE|tests/|\.github/)' || true)
          if [ -z "$other" ]; then
            echo "::notice::Only README, LICENSE, tests or .github changed, skipping version check"
            exit 0
          fi
          head_v=$(jq -r .version .claude-plugin/plugin.json)
          base_v=$(git show "origin/$BASE:.claude-plugin/plugin.json" | jq -r .version)
          if ! echo "$head_v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$head_v' (base: '$base_v'), expected X.Y.Z"
            exit 1
          fi
          if [ "$head_v" = "$base_v" ] || [ "$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -n1)" != "$head_v" ]; then
            echo "::error::Version not bumped: head $head_v, base $base_v"
            exit 1
          fi
          echo "Version bumped: base $base_v -> head $head_v"
